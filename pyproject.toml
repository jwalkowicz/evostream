[project]
name = "evostream"
version = "0.1.0"
description = "Stream clustering of text with drift detection and NSGA-II parameter adaptation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "confluent-kafka>=2.14.0",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "nltk>=3.9.4",
    "pandas>=3.0.2",
    "plotly>=7.0.0",
    "psutil>=7.2.2",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.0",
    "pymoo>=0.6.2",
    "redis>=7.4.0",
    "river>=0.19.0",
    "sentence-transformers>=5.4.1",
    "streamlit>=1.62.0",
    "torchvision>=0.28.0",
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
